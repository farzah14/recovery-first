name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Regenerate Linux Playwright visual baselines and upload them as an artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENVIRONMENT: local
  APP_DEFAULT_LOCALE: en-US
  APP_DEFAULT_TIMEZONE: UTC
  FEATURE_ANALYTICS: 'false'
  FEATURE_PREMIUM: 'false'
  FEATURE_WEB_PUSH: 'false'
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-key

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm verify

  database:
    name: Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase Local
        run: pnpm db:start

      - name: Reset database
        run: pnpm db:reset

      - name: Run database tests
        run: pnpm db:test

      - name: Stop Supabase Local
        if: always()
        run: pnpm db:stop

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase Local
        run: pnpm db:start

      - name: Reset database
        run: pnpm db:reset

      - name: Configure browser Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/supabase-status.env"
          pnpm exec supabase status -o env > "$status_file"
          api_url="$(grep '^API_URL=' "$status_file" | cut -d= -f2- | sed 's/^"//; s/"$//')"
          anon_key="$(grep '^ANON_KEY=' "$status_file" | cut -d= -f2- | sed 's/^"//; s/"$//')"
          test -n "$api_url"
          test -n "$anon_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$anon_key" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run browser smoke tests
        env:
          UPDATE_VISUAL_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots || 'false' }}
        run: |
          if [[ "$UPDATE_VISUAL_SNAPSHOTS" == "true" ]]; then
            pnpm test:visual -- --update-snapshots
          else
            pnpm test:e2e
          fi

      - name: Upload regenerated visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots == true }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux-${{ github.run_id }}
          path: tests/e2e/visual-baselines.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase Local
        if: always()
        run: pnpm db:stop
